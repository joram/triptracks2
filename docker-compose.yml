services:
  api:
    build:
      context: ./server
    entrypoint: ["uvicorn", "--host", "0.0.0.0", "--port", "8000", "main:app"]
    environment:
      TT_CONFIG_DIR: /data
      PORT: "8000"
      DATABASE_URL: postgresql://triptracks:triptracks@db:5432/triptracks
      # Plain default — VeilStream does not expand compose ${...} syntax at deploy time.
      # Override on the api service in VeilStream env vars if needed (not just web/build args).
      VEILSTREAM_AUTH_ROUTER_URL: https://auth.veilstream.com
    volumes:
      - triptracks_data:/data
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgis/postgis:18-3.6
    environment:
      POSTGRES_USER: triptracks
      POSTGRES_PASSWORD: triptracks
      POSTGRES_DB: triptracks
    volumes:
      - triptracks_pg:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U triptracks -d triptracks"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
      args:
        # Same-origin requests; nginx proxies /api to the api service.
        REACT_APP_API_URL: ""
        REACT_APP_VEILSTREAM_AUTH_ROUTER_URL: ${VEILSTREAM_AUTH_ROUTER_URL:-${VEILSTREAM_AUTH_BROKER_URL:-}}
        REACT_APP_OAUTH_CALLBACK_PATH: ${OAUTH_CALLBACK_PATH:-/auth/callback}
    ports:
      - "80:80"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  triptracks_data:
  triptracks_pg:
